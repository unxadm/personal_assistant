[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.1.0"
description = "Self-hosted, single-user personal assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.40",
    "httpx>=0.27",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "sqlite-vec>=0.1.6",
    "jsonschema>=4.20",
    "python-dateutil>=2.9",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
assistant = "assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.setuptools.package-data]
assistant = ["migrations/*.mako", "migrations/versions/*.py", "plugins/builtin/*/plugin.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
